<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090d16">
  <title>Migraine Diary</title>

  <!-- Complete Web App Manifest with Embedded App Icon -->
  <link rel="manifest" href='data:application/manifest+json;utf8,{
    "name": "Migraine Diary",
    "short_name": "Diary",
    "start_url": "./",
    "scope": "./",
    "display": "standalone",
    "background_color": "#090d16",
    "theme_color": "#090d16",
    "icons": [
      {
        "src": "data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 512 512%27%3E%3Crect width=%27512%27 height=%27512%27 rx=%27128%27 fill=%27%234f46e5%27/%3E%3Cpath d=%27M256 120v272M120 256h272%27 stroke=%27%23ffffff%27 stroke-width=%2748%27 stroke-linecap=%27round%27/%3E%3C/svg%3E",
        "sizes": "512x512",
        "type": "image/svg+xml",
        "purpose": "any maskable"
      }
    ]
  }'>

  <!-- React & Babel -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inline Service Worker for Standalone WebAPK Installation -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([
          `self.addEventListener('install', (e) => self.skipWaiting());
           self.addEventListener('activate', (e) => e.waitUntil(clients.claim()));
           self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));`
        ], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob))
          .catch((err) => console.log('SW registration note:', err));
      });
    }
  </script>
</head>
<body class="bg-[#090d16] text-slate-200 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function MigraineDiary() {
      const [entries, setEntries] = useState([]);
      const [showForm, setShowForm] = useState(false);
      const [view, setView] = useState('list');
      const [currentMonth, setCurrentMonth] = useState(new Date());

      const emptyForm = {
        date: new Date().toISOString().split('T')[0],
        hadHeadache: true,
        intensity: 'moderate',
        oneSided: false,
        nausea: false,
        lightSensitivity: false,
        movementDependent: false,
        medCategory: 'triptan',
        medication: '',
        notes: ''
      };

      const [formData, setFormData] = useState(emptyForm);

      useEffect(() => {
        try {
          const stored = localStorage.getItem('migraine_diary_entries');
          if (stored) setEntries(JSON.parse(stored));
        } catch (e) {
          console.error("Storage load error:", e);
        }
      }, []);

      const saveEntries = (updatedEntries) => {
        const sorted = [...updatedEntries].sort((a, b) => new Date(b.date) - new Date(a.date));
        setEntries(sorted);
        localStorage.setItem('migraine_diary_entries', JSON.stringify(sorted));
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const existingIndex = entries.findIndex(item => item.date === formData.date);
        let updated;
        if (existingIndex >= 0) {
          updated = [...entries];
          updated[existingIndex] = { ...formData, id: entries[existingIndex].id || Date.now() };
        } else {
          updated = [...entries, { ...formData, id: Date.now() }];
        }
        saveEntries(updated);
        setShowForm(false);
        setFormData(emptyForm);
      };

      const deleteEntry = (date) => {
        if (confirm(`Delete record for ${date}?`)) {
          saveEntries(entries.filter(e => e.date !== date));
        }
      };

      const stats = useMemo(() => {
        const now = new Date();
        const thirtyDaysAgo = new Date();
        thirtyDaysAgo.setDate(now.getDate() - 30);

        let attackDays = 0;
        let triptanDays = 0;
        let nsaidDays = 0;

        entries.forEach(e => {
          const d = new Date(e.date + 'T00:00:00');
          if (d >= thirtyDaysAgo && d <= now) {
            if (e.hadHeadache) attackDays++;
            if (e.medCategory === 'triptan') triptanDays++;
            if (e.medCategory === 'nsaid') nsaidDays++;
          }
        });

        return { attackDays, triptanDays, nsaidDays };
      }, [entries]);

      const exportCSV = () => {
        if (!entries.length) return alert('No entries to export yet.');
        const headers = ["Date", "Headache", "Intensity", "One-Sided", "Nausea", "Light Sensitivity", "Movement Aggravated", "Med Category", "Med Details", "Notes"];
        const rows = entries.map(e => [
          `"${e.date}"`,
          e.hadHeadache ? "Yes" : "No",
          `"${e.intensity || '-'}"`,
          e.oneSided ? "Yes" : "No",
          e.nausea ? "Yes" : "No",
          e.lightSensitivity ? "Yes" : "No",
          e.movementDependent ? "Yes" : "No",
          `"${e.medCategory || 'none'}"`,
          `"${(e.medication || '').replace(/"/g, '""')}"`,
          `"${(e.notes || '').replace(/"/g, '""')}"`
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `migraine_diary_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const year = currentMonth.getFullYear();
      const month = currentMonth.getMonth();
      const firstDayOfMonth = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const monthName = currentMonth.toLocaleString('default', { month: 'long', year: 'numeric' });

      return (
        <div class="max-w-md mx-auto p-4 pb-24 text-slate-300">
          <header class="flex items-center justify-between mb-5 border-b border-slate-800 pb-3">
            <div>
              <h1 class="text-xl font-bold text-slate-100 tracking-tight">Migraine Diary</h1>
              <p class="text-[11px] text-slate-500 font-mono">Offline • Device Storage</p>
            </div>
            <div class="flex items-center gap-2">
              <button 
                onClick={exportCSV} 
                class="p-2 rounded-lg bg-slate-900 border border-slate-800 hover:bg-slate-800 text-slate-400 hover:text-slate-200 transition" 
                title="Export CSV"
              >
                📥
              </button>
              <button 
                onClick={() => { setFormData(emptyForm); setShowForm(true); }} 
                class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-medium px-3.5 py-1.5 rounded-lg text-sm transition shadow-sm shadow-indigo-950"
              >
                + Log Day
              </button>
            </div>
          </header>

          <section class="grid grid-cols-2 gap-2.5 mb-5">
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-xl p-3">
              <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold block mb-1">
                Attacks (30d)
              </span>
              <div class="flex items-baseline gap-1.5">
                <span class={`text-2xl font-bold ${
                  stats.attackDays >= 15 ? 'text-rose-400' :
                  stats.attackDays >= 8 ? 'text-amber-400' : 'text-emerald-400'
                }`}>
                  {stats.attackDays}
                </span>
                <span class="text-xs text-slate-500">/ 30 days</span>
              </div>
              <span class="text-[10px] text-slate-500 mt-1 block">
                {stats.attackDays >= 15 ? '⚠️ Chronic threshold' : stats.attackDays <= 4 ? 'Low frequency' : 'Moderate frequency'}
              </span>
            </div>

            <div class={`bg-slate-900/80 border rounded-xl p-3 ${
              stats.triptanDays >= 10 ? 'border-rose-900/50 bg-rose-950/10' : 'border-slate-800/80'
            }`}>
              <span class="text-[11px] text-slate-400 uppercase tracking-wider font-semibold block mb-1">
                Triptan Days (30d)
              </span>
              <div class="flex items-baseline gap-1.5">
                <span class={`text-2xl font-bold ${
                  stats.triptanDays >= 10 ? 'text-rose-400' :
                  stats.triptanDays >= 7 ? 'text-amber-400' : 'text-indigo-300'
                }`}>
                  {stats.triptanDays}
                </span>
                <span class="text-xs text-slate-500">/ 10 max</span>
              </div>
              <span class="text-[10px] text-slate-500 mt-1 block">
                {stats.triptanDays >= 10 ? '🚨 MOH Risk reached' : 'MOH Safe limit: <10d'}
              </span>
            </div>
          </section>

          <div class="flex rounded-lg bg-slate-900 border border-slate-800 p-0.5 mb-4 text-xs font-medium">
            <button 
              onClick={() => setView('list')}
              class={`flex-1 py-1.5 rounded-md transition ${view === 'list' ? 'bg-slate-800 text-slate-100' : 'text-slate-500 hover:text-slate-300'}`}
            >
              List View
            </button>
            <button 
              onClick={() => setView('calendar')}
              class={`flex-1 py-1.5 rounded-md transition ${view === 'calendar' ? 'bg-slate-800 text-slate-100' : 'text-slate-500 hover:text-slate-300'}`}
            >
              Calendar View
            </button>
          </div>

          {showForm && (
            <div class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-[#111726] border border-slate-800 rounded-2xl p-5 w-full max-w-sm shadow-2xl max-h-[90vh] overflow-y-auto">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800/80 pb-2.5">
                  <h2 class="text-base font-semibold text-slate-100">Log Episode / Day</h2>
                  <button onClick={() => setShowForm(false)} class="text-slate-400 hover:text-slate-200 text-lg px-2">✕</button>
                </div>

                <form onSubmit={handleSubmit} class="space-y-4 text-xs">
                  <div>
                    <label class="block text-slate-400 font-medium mb-1">Date</label>
                    <input 
                      type="date" 
                      required
                      value={formData.date} 
                      onChange={e => setFormData({ ...formData, date: e.target.value })} 
                      class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:border-indigo-500 outline-none"
                    />
                  </div>

                  <div class="pt-1">
                    <label class="flex items-center gap-2 font-medium text-slate-200 cursor-pointer select-none">
                      <input 
                        type="checkbox" 
                        checked={formData.hadHeadache} 
                        onChange={e => setFormData({ ...formData, hadHeadache: e.target.checked })}
                        class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-0"
                      />
                      <span>Headache or Migraine present</span>
                    </label>
                  </div>

                  {formData.hadHeadache && (
                    <div class="p-3 bg-slate-900/60 border border-slate-800 rounded-xl space-y-3">
                      <div>
                        <label class="block text-[10px] font-semibold text-slate-400 uppercase mb-1">Pain Intensity</label>
                        <div class="grid grid-cols-3 gap-1.5">
                          {['mild', 'moderate', 'severe'].map(lvl => (
                            <button
                              type="button"
                              key={lvl}
                              onClick={() => setFormData({ ...formData, intensity: lvl })}
                              class={`py-1.5 rounded-lg border text-xs capitalize font-medium transition ${
                                formData.intensity === lvl 
                                  ? 'bg-indigo-950/60 border-indigo-500 text-indigo-300' 
                                  : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'
                              }`}
                            >
                              {lvl}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div class="space-y-2 pt-1 text-slate-300">
                        <label class="flex items-center gap-2 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={formData.oneSided} 
                            onChange={e => setFormData({ ...formData, oneSided: e.target.checked })} 
                            class="rounded bg-slate-800 border-slate-700 text-indigo-500"
                          />
                          <span>One-sided pain (unilateral)</span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={formData.nausea} 
                            onChange={e => setFormData({ ...formData, nausea: e.target.checked })} 
                            class="rounded bg-slate-800 border-slate-700 text-indigo-500"
                          />
                          <span>Nausea or vomiting</span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={formData.lightSensitivity} 
                            onChange={e => setFormData({ ...formData, lightSensitivity: e.target.checked })} 
                            class="rounded bg-slate-800 border-slate-700 text-indigo-500"
                          />
                          <span>Light / Sound sensitivity</span>
                        </label>

                        <label class="flex items-center gap-2 cursor-pointer">
                          <input 
                            type="checkbox" 
                            checked={formData.movementDependent} 
                            onChange={e => setFormData({ ...formData, movementDependent: e.target.checked })} 
                            class="rounded bg-slate-800 border-slate-700 text-indigo-500"
                          />
                          <span>Aggravated by movement</span>
                        </label>
                      </div>
                    </div>
                  )}

                  <div>
                    <label class="block text-slate-400 font-medium mb-1">Medication Category (MOH Tracking)</label>
                    <div class="grid grid-cols-4 gap-1 mb-2">
                      {[
                        { id: 'none', label: 'None' },
                        { id: 'triptan', label: 'Triptan' },
                        { id: 'nsaid', label: 'NSAID' },
                        { id: 'other', label: 'Other' },
                      ].map(cat => (
                        <button
                          type="button"
                          key={cat.id}
                          onClick={() => setFormData({ ...formData, medCategory: cat.id })}
                          class={`py-1 rounded text-center border text-[11px] font-medium transition ${
                            formData.medCategory === cat.id 
                              ? 'bg-indigo-600 border-indigo-500 text-white' 
                              : 'bg-slate-900 border-slate-800 text-slate-400 hover:border-slate-700'
                          }`}
                        >
                          {cat.label}
                        </button>
                      ))}
                    </div>

                    <input 
                      type="text" 
                      placeholder="Med name & dose (e.g. Zolmitriptan 2.5mg)" 
                      value={formData.medication} 
                      onChange={e => setFormData({ ...formData, medication: e.target.value })} 
                      class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:border-indigo-500 outline-none"
                    />
                  </div>

                  <div>
                    <label class="block text-slate-400 font-medium mb-1">Triggers & Notes</label>
                    <textarea 
                      placeholder="e.g. Poor sleep, missed meal, weather change..." 
                      rows="2"
                      value={formData.notes} 
                      onChange={e => setFormData({ ...formData, notes: e.target.value })} 
                      class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:border-indigo-500 outline-none"
                    ></textarea>
                  </div>

                  <div class="flex gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setShowForm(false)} 
                      class="flex-1 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      class="flex-1 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-medium transition"
                    >
                      Save
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {view === 'list' && (
            <div class="space-y-2">
              {entries.length === 0 ? (
                <div class="text-center py-10 bg-slate-900/40 rounded-xl border border-dashed border-slate-800 p-4">
                  <p class="text-slate-500 text-xs">No entries recorded yet.</p>
                </div>
              ) : (
                entries.map(e => (
                  <div key={e.date} class="bg-slate-900/60 border border-slate-800/80 rounded-xl p-3 relative">
                    <div class="flex items-start justify-between">
                      <div>
                        <div class="flex items-center gap-2">
                          <span class="font-mono text-sm font-semibold text-slate-200">{e.date}</span>
                          {e.hadHeadache ? (
                            <span class={`text-[10px] px-2 py-0.5 rounded font-medium ${
                              e.intensity === 'severe' ? 'bg-rose-950/70 text-rose-300 border border-rose-800/50' :
                              e.intensity === 'moderate' ? 'bg-amber-950/70 text-amber-300 border border-amber-800/50' :
                              'bg-yellow-950/70 text-yellow-300 border border-yellow-800/50'
                            }`}>
                              {e.intensity}
                            </span>
                          ) : (
                            <span class="text-[10px] px-2 py-0.5 rounded bg-emerald-950/50 text-emerald-400 border border-emerald-800/40">Clear</span>
                          )}
                          
                          {e.medCategory && e.medCategory !== 'none' && (
                            <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-indigo-300 border border-slate-700">
                              {e.medCategory.toUpperCase()}
                            </span>
                          )}
                        </div>

                        {e.hadHeadache && (
                          <div class="flex flex-wrap gap-1 mt-2">
                            {e.oneSided && <span class="bg-slate-800/70 text-slate-400 text-[10px] px-1.5 py-0.5 rounded">One-sided</span>}
                            {e.nausea && <span class="bg-slate-800/70 text-slate-400 text-[10px] px-1.5 py-0.5 rounded">Nausea</span>}
                            {e.lightSensitivity && <span class="bg-slate-800/70 text-slate-400 text-[10px] px-1.5 py-0.5 rounded">Photophobia</span>}
                            {e.movementDependent && <span class="bg-slate-800/70 text-slate-400 text-[10px] px-1.5 py-0.5 rounded">Movement</span>}
                          </div>
                        )}

                        {e.medication && (
                          <p class="text-xs text-slate-400 mt-1.5">
                            <span class="text-slate-500">Rx:</span> {e.medication}
                          </p>
                        )}
                        {e.notes && (
                          <p class="text-[11px] text-slate-500 mt-1 italic">
                            "{e.notes}"
                          </p>
                        )}
                      </div>

                      <button 
                        onClick={() => deleteEntry(e.date)} 
                        class="text-slate-600 hover:text-rose-400 text-base px-2 py-0.5 transition"
                        title="Delete"
                      >
                        ✕
                      </button>
                    </div>
                  </div>
                ))
              )}
            </div>
          )}

          {view === 'calendar' && (
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3">
              <div class="flex items-center justify-between mb-3">
                <span class="font-semibold text-sm text-slate-200">{monthName}</span>
                <div class="flex gap-1">
                  <button 
                    onClick={() => setCurrentMonth(new Date(year, month - 1, 1))}
                    class="p-1 px-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs"
                  >
                    ‹
                  </button>
                  <button 
                    onClick={() => setCurrentMonth(new Date(year, month + 1, 1))}
                    class="p-1 px-2 rounded bg-slate-800 hover:bg-slate-700 text-slate-400 text-xs"
                  >
                    ›
                  </button>
                </div>
              </div>

              <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-semibold text-slate-500 mb-1.5">
                <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
              </div>

              <div class="grid grid-cols-7 gap-1 text-xs">
                {Array.from({ length: firstDayOfMonth }).map((_, i) => (
                  <div key={'empty-' + i} class="h-9"></div>
                ))}
                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const dayNum = i + 1;
                  const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayNum).padStart(2, '0')}`;
                  const entry = entries.find(e => e.date === dateStr);

                  return (
                    <div 
                      key={dateStr}
                      onClick={() => {
                        if (entry) {
                          setFormData(entry);
                        } else {
                          setFormData({ ...emptyForm, date: dateStr, hadHeadache: false });
                        }
                        setShowForm(true);
                      }}
                      class={`h-9 rounded-lg border flex flex-col items-center justify-center cursor-pointer transition relative ${
                        entry?.hadHeadache 
                          ? entry.intensity === 'severe' 
                            ? 'bg-rose-950/40 border-rose-800/80 text-rose-300 font-semibold' 
                            : 'bg-amber-950/40 border-amber-800/80 text-amber-300 font-semibold'
                          : entry 
                            ? 'bg-emerald-950/30 border-emerald-900/60 text-emerald-400'
                            : 'border-slate-850 hover:bg-slate-800 text-slate-500'
                      }`}
                    >
                      <span>{dayNum}</span>
                      {entry?.hadHeadache && (
                        <span class={`w-1 h-1 rounded-full mt-0.5 ${
                          entry.intensity === 'severe' ? 'bg-rose-400' : 'bg-amber-400'
                        }`}></span>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<MigraineDiary />);
  </script>
</body>
</html>
