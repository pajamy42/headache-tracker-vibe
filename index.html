<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <meta name="color-scheme" content="dark">
  <title>Migraine Diary</title>

  <!-- Proper Web App Manifest & Favicon -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="https://cdn-icons-png.flaticon.com/192/822/822143.png">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/192/822/822143.png">

  <link rel="stylesheet" href="styles.css">

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW registered successfully'))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</head>
<body class="bg-[#090d16] text-slate-200 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script src="app.js"></script>
</body>
</html>
